<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelQuest</title>

  <!-- Polices -->
  <link href="https://fonts.googleapis.com/css?family=Jolly+Lodger|Inter:wght@400;600" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    // Ajout de la police Inter + Jolly Lodger dans Tailwind
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'jolly': ['"Jolly Lodger"', 'cursive'],
            'inter': ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Jolly Lodger', cursive;
    }
    /* Arrière-plan avec image + dégradé */
    .hero-bg {
      background-image: 
  linear-gradient(65deg,rgba(18, 115, 176, 1) 0%, rgba(250, 252, 255, 0) 100%
        ),
        url('./image/God\ of\ War\ Poster\ -\ Carlos\ Dattoli.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen m-0 p-0 font-jolly">

  <!-- Hero section -->
  <div class="hero-bg flex flex-col min-h-screen relative">

    <!-- En-tête -->
    <header class="flex justify-between items-center p-6 w-full max-w-7xl mx-auto mt-6">
      <img src="https://via.placeholder.com/150x60/001542/FFFFFF?text=LOGO" alt="Logo PixelQuest" class="h-12">
      <button class="bg-[#73B9FF] text-[#001542] font-bold px-6 py-2 rounded-full text-lg hover:bg-[#5fb0ff] transition">
        Sign up
      </button>
    </header>

    <!-- Contenu principal centré verticalement -->
    <div class="flex flex-col justify-center items-start px-6 max-w-4xl mt-16">
      <h1 class="text-[#DEE912] text-5xl md:text-7xl font-bold drop-shadow-md">
        PixelQuest
      </h1>
      <p class="font-inter text-white text-lg md:text-2xl mt-4 leading-relaxed max-w-2xl">
        Plongez dans le monde du divertissement interactif et explorez les meilleurs jeux du moment.
      </p>
    </div>

  </div>

</body>
</html>
